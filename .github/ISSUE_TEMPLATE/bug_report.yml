name: 报告故障
description: 用最少步骤说明问题，帮助我们复现。
title: "[故障] "
body:
  - type: textarea
    id: versions
    attributes:
      label: 版本与环境
      description: Minecraft、NeoForge、Core 的版本；单人或服务端；相关模组及版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 从进入游戏开始，按顺序写出触发问题的操作。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: 分别说明预期发生什么、实际发生什么。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图
      description: 保留报错前后的上下文。发布前删除令牌、私人地址和个人信息。
